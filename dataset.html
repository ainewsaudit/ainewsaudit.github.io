<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Dataset Analysis - AI News Audit</title>
    <link rel="icon" type="image/svg+xml" href="/additional_data/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="/static-data-loader.js?v=1760921765"></script>
</head>
<!-- Version: 2025-10-19-v5 -->
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Header -->
        <div class="mb-4 sm:mb-6">
            <a href="/" class="text-blue-600 hover:underline mb-3 sm:mb-4 inline-block text-sm sm:text-base">← Back to Search</a>
            <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-gray-900 mb-2" id="dataset-title">Dataset Analysis</h1>
            <p class="text-base sm:text-lg text-gray-600 px-2 sm:px-0" id="dataset-description">Comprehensive statistics and trends</p>
        </div>

        <!-- Dataset Selector -->
        <div class="bg-white rounded-xl shadow-lg p-4 sm:p-6 mb-6 sm:mb-8">
            <h2 class="text-lg sm:text-xl font-bold text-gray-900 mb-4">Select Dataset</h2>
            <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
                <button onclick="loadDataset('recent_news')" id="btn-recent_news" 
                        class="flex-1 px-4 sm:px-6 py-3 rounded-lg font-semibold transition-all text-sm sm:text-base">
                    📰 Recent News
                </button>
                <button onclick="loadDataset('opinions')" id="btn-opinions"
                        class="flex-1 px-4 sm:px-6 py-3 rounded-lg font-semibold transition-all text-sm sm:text-base">
                    💭 Opinions
                </button>
                <button onclick="loadDataset('reporters')" id="btn-reporters"
                        class="flex-1 px-4 sm:px-6 py-3 rounded-lg font-semibold transition-all text-sm sm:text-base">
                    👤 Reporters
                </button>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="text-center py-12 hidden">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            <p class="text-gray-600 mt-4">Loading dataset statistics...</p>
        </div>

        <!-- Charts Container -->
        <div id="charts-container" class="hidden">
            <!-- Summary Stats -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6 mb-6 sm:mb-8" id="summary-stats"></div>

            <!-- Charts Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6 lg:gap-8 mb-6 sm:mb-8">
                <!-- Prediction Distribution Pie Chart -->
                <div class="bg-white rounded-xl shadow-lg p-4 sm:p-6">
                    <h2 class="text-lg sm:text-xl lg:text-2xl font-bold text-gray-900 mb-3 sm:mb-4">Prediction Distribution</h2>
                    <div class="max-w-sm sm:max-w-md mx-auto">
                        <canvas id="predictionChart"></canvas>
                    </div>
                </div>

                <!-- Topic Distribution Pie Chart -->
                <div class="bg-white rounded-xl shadow-lg p-4 sm:p-6">
                    <h2 class="text-lg sm:text-xl lg:text-2xl font-bold text-gray-900 mb-3 sm:mb-4">Top Topics</h2>
                    <canvas id="topicChart"></canvas>
                </div>
            </div>

            <!-- Newspaper Distribution Chart (only for opinions dataset) -->
            <div id="newspaper-chart-container" class="bg-white rounded-xl shadow-lg p-4 sm:p-6 mb-6 sm:mb-8 hidden">
                <h2 class="text-lg sm:text-xl lg:text-2xl font-bold text-gray-900 mb-3 sm:mb-4">Top Newspapers</h2>
                <canvas id="newspaperChart"></canvas>
            </div>

            <!-- Time Series Line Chart (Full Width) -->
            <div class="bg-white rounded-xl shadow-lg p-4 sm:p-6">
                <h2 class="text-lg sm:text-xl lg:text-2xl font-bold text-gray-900 mb-3 sm:mb-4">AI/Mixed Predictions Over Time</h2>
                <canvas id="timeSeriesChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Static data loader
        console.log('Using static data loader');
        let currentDataset = null;
        let charts = {
            prediction: null,
            topic: null,
            newspaper: null,
            timeSeries: null
        };

        const datasetInfo = {
            'recent_news': {
                title: 'Recent News Analysis',
                description: 'Analysis of recent news articles',
                color: '#3b82f6'
            },
            'opinions': {
                title: 'Opinions Analysis',
                description: 'Analysis of opinion pieces and editorials',
                color: '#8b5cf6'
            },
            'reporters': {
                title: 'Reporters Analysis',
                description: 'Analysis of reporter-attributed articles',
                color: '#f59e0b'
            }
        };

        // Update button styles
        function updateButtonStyles(activeDataset) {
            ['recent_news', 'opinions', 'reporters'].forEach(dataset => {
                const btn = document.getElementById(`btn-${dataset}`);
                if (dataset === activeDataset) {
                    btn.className = 'flex-1 px-4 sm:px-6 py-3 rounded-lg font-semibold transition-all bg-blue-600 text-white shadow-lg text-sm sm:text-base';
                } else {
                    btn.className = 'flex-1 px-4 sm:px-6 py-3 rounded-lg font-semibold transition-all bg-gray-200 text-gray-700 hover:bg-gray-300 text-sm sm:text-base';
                }
            });
        }

        async function loadDataset(datasetType) {
            currentDataset = datasetType;
            updateButtonStyles(datasetType);
            
            // Update header
            const info = datasetInfo[datasetType];
            document.getElementById('dataset-title').textContent = info.title;
            document.getElementById('dataset-description').textContent = info.description;
            
            // Show loading
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('charts-container').classList.add('hidden');
            
            try {
                const data = await window.dataLoader.getDatasetStats(datasetType);
                
                await renderCharts(data);
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('charts-container').classList.remove('hidden');
            } catch (error) {
                console.error('Error loading dataset stats:', error);
                alert('Error loading dataset statistics. Please try again.');
                document.getElementById('loading').classList.add('hidden');
            }
        }

        async function renderCharts(data) {
            // Destroy existing charts
            Object.values(charts).forEach(chart => {
                if (chart) chart.destroy();
            });
            
            // Calculate summary stats using only normalized categories (Human, Mixed, AI)
            const predictionData = ['Human', 'Mixed', 'AI']
                .map(label => ({
                    prediction: label,
                    count: data.prediction_distribution.find(p => p.prediction === label)?.count || 0
                }));

            const totalArticles = predictionData.reduce((sum, item) => sum + item.count, 0);
            const humanCount = predictionData.find(p => p.prediction === 'Human')?.count || 0;
            const mixedCount = predictionData.find(p => p.prediction === 'Mixed')?.count || 0;
            const aiCount = predictionData.find(p => p.prediction === 'AI')?.count || 0;
            
            // Render summary stats
            document.getElementById('summary-stats').innerHTML = `
                <div class="bg-gradient-to-br from-blue-50 to-blue-100 p-4 sm:p-6 rounded-lg">
                    <div class="text-2xl sm:text-3xl lg:text-4xl font-bold text-blue-700">${totalArticles.toLocaleString()}</div>
                    <div class="text-xs sm:text-sm text-blue-600">Total Articles</div>
                </div>
                <div class="bg-gradient-to-br from-green-50 to-green-100 p-4 sm:p-6 rounded-lg">
                    <div class="text-2xl sm:text-3xl lg:text-4xl font-bold text-green-700">${((humanCount / totalArticles) * 100).toFixed(1)}%</div>
                    <div class="text-xs sm:text-sm text-green-600">Human-Written</div>
                </div>
                <div class="bg-gradient-to-br from-red-50 to-red-100 p-4 sm:p-6 rounded-lg">
                    <div class="text-2xl sm:text-3xl lg:text-4xl font-bold text-red-700">${(((aiCount + mixedCount) / totalArticles) * 100).toFixed(1)}%</div>
                    <div class="text-xs sm:text-sm text-red-600">AI/Mixed Content</div>
                </div>
            `;
            
            // 1. Prediction Distribution Pie Chart (using normalized order above)
            
            // Map colors based on prediction type
            const predictionColors = predictionData.map(p => {
                if (p.prediction === 'Human') return '#10b981'; // Green
                if (p.prediction === 'Mixed') return '#f59e0b'; // Orange/Yellow
                if (p.prediction === 'AI') return '#ef4444';    // Red
                return '#6b7280'; // Gray fallback
            });
            
            charts.prediction = new Chart(document.getElementById('predictionChart'), {
                type: 'pie',
                data: {
                    labels: predictionData.map(p => p.prediction),
                    datasets: [{
                        data: predictionData.map(p => p.count),
                        backgroundColor: predictionColors,
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    onClick: (event, elements) => {
                        if (elements.length > 0) {
                            const elementIndex = elements[0].index;
                            const prediction = predictionData[elementIndex].prediction;
                            const datasetType = currentDataset;
                            const url = `search.html?dataset_type=${datasetType}&prediction=${encodeURIComponent(prediction)}`;
                            window.open(url, '_blank');
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { size: 14 },
                                padding: 20
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed;
                                    const percentage = ((value / totalArticles) * 100).toFixed(1);
                                    return `${context.label}: ${value.toLocaleString()} (${percentage}%) - Click to view examples`;
                                }
                            }
                        }
                    }
                }
            });
            
            // 2. Time Series Line Chart
            const timeData = data.time_series;
            charts.timeSeries = new Chart(document.getElementById('timeSeriesChart'), {
                type: 'line',
                data: {
                    labels: timeData.map(t => t.month),
                    datasets: [
                        {
                            label: 'AI Content %',
                            data: timeData.map(t => ((t.ai_count / t.total) * 100).toFixed(2)),
                            borderColor: '#ef4444',
                            backgroundColor: 'rgba(239, 68, 68, 0.1)',
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: 'Mixed Content %',
                            data: timeData.map(t => ((t.mixed_count / t.total) * 100).toFixed(2)),
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.1)',
                            tension: 0.4,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Percentage (%)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Month'
                            }
                        }
                    }
                }
            });
            
            // 3. Topic Distribution Pie Chart
            const topicData = data.topic_distribution;
            const colors = [
                '#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981',
                '#06b6d4', '#6366f1', '#a855f7', '#d946ef', '#f43f5e',
                '#84cc16', '#22c55e', '#14b8a6', '#0ea5e9', '#6366f1'
            ];
            
            charts.topic = new Chart(document.getElementById('topicChart'), {
                type: 'pie',
                data: {
                    labels: topicData.map(t => t.primary_topic),
                    datasets: [{
                        data: topicData.map(t => t.count),
                        backgroundColor: colors,
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    onClick: (event, elements) => {
                        if (elements.length > 0) {
                            const elementIndex = elements[0].index;
                            const topic = topicData[elementIndex].primary_topic;
                            const datasetType = currentDataset;
                            const url = `search.html?dataset_type=${datasetType}&topic=${encodeURIComponent(topic)}`;
                            window.open(url, '_blank');
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                font: { size: 11 },
                                padding: 10,
                                boxWidth: 12
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const value = context.parsed;
                                    const percentage = ((value / total) * 100).toFixed(1);
                                    return `${context.label}: ${value.toLocaleString()} (${percentage}%) - Click to view examples`;
                                }
                            }
                        }
                    }
                }
            });
            
            // 4. Newspaper Distribution Stacked Bar Chart (only for opinions dataset)
            const newspaperContainer = document.getElementById('newspaper-chart-container');
            
            if (currentDataset === 'opinions') {
                // Show newspaper chart for opinions dataset
                newspaperContainer.classList.remove('hidden');
                
                const newspaperData = data.newspaper_distribution || [];
                
                // Process newspaper data to get prediction breakdowns
                const processedNewspaperData = await Promise.all(
                    newspaperData.map(async (newspaper) => {
                        try {
                            // Get articles for this newspaper to analyze predictions
                            const articles = await window.dataLoader.getArticles({
                                newspaper: newspaper.newspaper,
                                dataset_type: currentDataset,
                                limit: 1000 // Get a sample for analysis
                            });
                            
                            // Count predictions
                            const predictionCounts = { Human: 0, Mixed: 0, AI: 0 };
                            articles.articles.forEach(article => {
                                const prediction = article.prediction;
                                if (predictionCounts.hasOwnProperty(prediction)) {
                                    predictionCounts[prediction]++;
                                }
                            });
                            
                            return {
                                newspaper: newspaper.newspaper,
                                total: newspaper.count,
                                human: predictionCounts.Human,
                                mixed: predictionCounts.Mixed,
                                ai: predictionCounts.AI
                            };
                        } catch (error) {
                            console.warn(`Error processing newspaper ${newspaper.newspaper}:`, error);
                            // Fallback to equal distribution
                            const total = newspaper.count;
                            return {
                                newspaper: newspaper.newspaper,
                                total: total,
                                human: Math.floor(total * 0.6),
                                mixed: Math.floor(total * 0.2),
                                ai: Math.floor(total * 0.2)
                            };
                        }
                    })
                );
                
                charts.newspaper = new Chart(document.getElementById('newspaperChart'), {
                    type: 'bar',
                    data: {
                        labels: processedNewspaperData.map(n => n.newspaper),
                        datasets: [
                            {
                                label: 'AI',
                                data: processedNewspaperData.map(n => n.ai),
                                backgroundColor: '#ef4444', // Red
                                borderColor: '#dc2626',
                                borderWidth: 1
                            },
                            {
                                label: 'Mixed',
                                data: processedNewspaperData.map(n => n.mixed),
                                backgroundColor: '#f59e0b', // Yellow/Orange
                                borderColor: '#d97706',
                                borderWidth: 1
                            },
                            {
                                label: 'Human',
                                data: processedNewspaperData.map(n => n.human),
                                backgroundColor: '#10b981', // Green
                                borderColor: '#059669',
                                borderWidth: 1
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        onClick: (event, elements) => {
                            if (elements.length > 0) {
                                const element = elements[0];
                                const newspaper = processedNewspaperData[element.index].newspaper;
                                const datasetType = currentDataset;
                                const datasetIndex = element.datasetIndex;
                                let prediction = '';
                                
                                // Determine which prediction type was clicked
                                if (datasetIndex === 0) prediction = 'AI';
                                else if (datasetIndex === 1) prediction = 'Mixed';
                                else if (datasetIndex === 2) prediction = 'Human';
                                
                                const url = `search.html?dataset_type=${datasetType}&newspaper=${encodeURIComponent(newspaper)}&prediction=${encodeURIComponent(prediction)}`;
                                window.open(url, '_blank');
                            }
                        },
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top',
                                labels: {
                                    font: { size: 12 },
                                    padding: 15
                                }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const value = context.parsed.y;
                                        const total = processedNewspaperData[context.dataIndex].total;
                                        const percentage = ((value / total) * 100).toFixed(1);
                                        return `${context.dataset.label}: ${value.toLocaleString()} articles (${percentage}%) - Click to view examples`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                stacked: true,
                                title: {
                                    display: true,
                                    text: 'Newspaper'
                                }
                            },
                            y: {
                                stacked: true,
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Number of Articles'
                                }
                            }
                        }
                    }
                });
            } else {
                // Hide newspaper chart for other datasets
                newspaperContainer.classList.add('hidden');
                // Destroy existing chart if it exists
                if (charts.newspaper) {
                    charts.newspaper.destroy();
                    charts.newspaper = null;
                }
            }
        }

        // Load dataset from URL query parameter
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const datasetType = urlParams.get('type') || 'recent_news';
            loadDataset(datasetType);
        });
    </script>
</body>
</html>
