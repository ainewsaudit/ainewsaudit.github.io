<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Dataset Analysis - AI News Audit</title>
    <link rel="icon" type="image/svg+xml" href="/additional_data/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="/static-data-loader.js?v=1760921765"></script>
<style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .ds-btn {
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 500;
        border-radius: 8px;
        transition: all 150ms ease;
        border: 1px solid #e5e7eb;
        background: white;
        color: #6b7280;
        cursor: pointer;
    }
    .ds-btn:hover { border-color: #d1d5db; color: #374151; }
    .ds-btn.active {
        background: #0f172a;
        color: white;
        border-color: #0f172a;
    }
</style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <header class="bg-slate-900">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-14">
                <a href="/" class="text-white font-semibold text-sm">AI News Audit</a>
                <nav class="flex items-center gap-6">
                    <a href="/" class="text-slate-400 hover:text-white text-sm transition-colors">Search</a>
                    <a href="dataset.html" class="text-white text-sm font-medium">Datasets</a>
                    <a href="metrics.html" class="text-slate-400 hover:text-white text-sm transition-colors">Metrics</a>
                </nav>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight mb-1" id="dataset-title">Dataset Analysis</h1>
            <p class="text-sm text-gray-500" id="dataset-description">Comprehensive statistics and trends</p>
        </div>

        <!-- Dataset Selector -->
        <div class="flex flex-wrap gap-2 mb-8">
            <button onclick="loadDataset('recent_news')" id="btn-recent_news" class="ds-btn">Recent News</button>
            <button onclick="loadDataset('opinions')" id="btn-opinions" class="ds-btn">Opinions</button>
            <button onclick="loadDataset('reporters')" id="btn-reporters" class="ds-btn">Reporters</button>
        </div>

        <!-- Loading -->
        <div id="loading" class="hidden bg-white border border-gray-200 rounded-xl p-8 text-center">
            <div class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-slate-900 border-t-transparent mb-3"></div>
            <p class="text-sm text-gray-500">Loading dataset statistics...</p>
        </div>

        <!-- Charts Container -->
        <div id="charts-container" class="hidden">
            <!-- Summary Stats -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8" id="summary-stats"></div>

            <!-- Charts Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6 mb-6">
                <div class="bg-white rounded-xl border border-gray-200 p-5">
                    <h2 class="text-sm font-semibold text-gray-900 mb-4">Prediction Distribution</h2>
                    <div class="max-w-xs mx-auto">
                        <canvas id="predictionChart"></canvas>
                    </div>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-5">
                    <h2 class="text-sm font-semibold text-gray-900 mb-4">Top Topics</h2>
                    <canvas id="topicChart"></canvas>
                </div>
            </div>

            <!-- Newspaper Chart (opinions only) -->
            <div id="newspaper-chart-container" class="bg-white rounded-xl border border-gray-200 p-5 mb-6 hidden">
                <h2 class="text-sm font-semibold text-gray-900 mb-4">Top Newspapers</h2>
                <canvas id="newspaperChart"></canvas>
            </div>

            <!-- Time Series -->
            <div class="bg-white rounded-xl border border-gray-200 p-5">
                <h2 class="text-sm font-semibold text-gray-900 mb-4">AI/Mixed Predictions Over Time</h2>
                <canvas id="timeSeriesChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-gray-200 mt-12 py-6">
        <p class="text-center text-xs text-gray-400">Website made with the help of Claude Opus via Cursor</p>
    </footer>

    <script>
        console.log('Using static data loader');
        let currentDataset = null;
        let charts = {
            prediction: null,
            topic: null,
            newspaper: null,
            timeSeries: null
        };

        const datasetInfo = {
            'recent_news': {
                title: 'Recent News Analysis',
                description: 'Analysis of recent news articles',
                color: '#3b82f6'
            },
            'opinions': {
                title: 'Opinions Analysis',
                description: 'Analysis of opinion pieces and editorials',
                color: '#8b5cf6'
            },
            'reporters': {
                title: 'Reporters Analysis',
                description: 'Analysis of reporter-attributed articles',
                color: '#f59e0b'
            }
        };

        function updateButtonStyles(activeDataset) {
            ['recent_news', 'opinions', 'reporters'].forEach(dataset => {
                const btn = document.getElementById(`btn-${dataset}`);
                if (dataset === activeDataset) {
                    btn.className = 'ds-btn active';
                } else {
                    btn.className = 'ds-btn';
                }
            });
        }

        async function loadDataset(datasetType) {
            currentDataset = datasetType;
            updateButtonStyles(datasetType);
            
            const info = datasetInfo[datasetType];
            document.getElementById('dataset-title').textContent = info.title;
            document.getElementById('dataset-description').textContent = info.description;
            
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('charts-container').classList.add('hidden');
            
            try {
                const data = await window.dataLoader.getDatasetStats(datasetType);
                await renderCharts(data);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('charts-container').classList.remove('hidden');
            } catch (error) {
                console.error('Error loading dataset stats:', error);
                alert('Error loading dataset statistics. Please try again.');
                document.getElementById('loading').classList.add('hidden');
            }
        }

        async function renderCharts(data) {
            Object.values(charts).forEach(chart => {
                if (chart) chart.destroy();
            });
            
            const predictionData = ['Human', 'Mixed', 'AI']
                .map(label => ({
                    prediction: label,
                    count: data.prediction_distribution.find(p => p.prediction === label)?.count || 0
                }));

            const totalArticles = predictionData.reduce((sum, item) => sum + item.count, 0);
            const humanCount = predictionData.find(p => p.prediction === 'Human')?.count || 0;
            const mixedCount = predictionData.find(p => p.prediction === 'Mixed')?.count || 0;
            const aiCount = predictionData.find(p => p.prediction === 'AI')?.count || 0;
            
            document.getElementById('summary-stats').innerHTML = `
                <div class="bg-white rounded-xl border border-gray-200 p-5 relative overflow-hidden">
                    <div class="absolute top-0 left-0 right-0 h-0.5 bg-blue-500"></div>
                    <div class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">${totalArticles.toLocaleString()}</div>
                    <div class="text-xs text-gray-500 mt-1">Total Articles</div>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-5 relative overflow-hidden">
                    <div class="absolute top-0 left-0 right-0 h-0.5 bg-emerald-500"></div>
                    <div class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">${((humanCount / totalArticles) * 100).toFixed(1)}%</div>
                    <div class="text-xs text-gray-500 mt-1">Human-Written</div>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-5 relative overflow-hidden">
                    <div class="absolute top-0 left-0 right-0 h-0.5 bg-red-500"></div>
                    <div class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">${(((aiCount + mixedCount) / totalArticles) * 100).toFixed(1)}%</div>
                    <div class="text-xs text-gray-500 mt-1">AI/Mixed Content</div>
                </div>
            `;
            
            const predictionColors = predictionData.map(p => {
                if (p.prediction === 'Human') return '#10b981';
                if (p.prediction === 'Mixed') return '#f59e0b';
                if (p.prediction === 'AI') return '#ef4444';
                return '#6b7280';
            });
            
            const chartDefaults = {
                font: { family: 'Inter' }
            };
            Chart.defaults.font.family = 'Inter';
            
            charts.prediction = new Chart(document.getElementById('predictionChart'), {
                type: 'pie',
                data: {
                    labels: predictionData.map(p => p.prediction),
                    datasets: [{
                        data: predictionData.map(p => p.count),
                        backgroundColor: predictionColors,
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    onClick: (event, elements) => {
                        if (elements.length > 0) {
                            const elementIndex = elements[0].index;
                            const prediction = predictionData[elementIndex].prediction;
                            window.open(`search.html?dataset_type=${currentDataset}&prediction=${encodeURIComponent(prediction)}`, '_blank');
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { font: { size: 12 }, padding: 16 }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed;
                                    const percentage = ((value / totalArticles) * 100).toFixed(1);
                                    return `${context.label}: ${value.toLocaleString()} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
            
            const timeData = data.time_series;
            charts.timeSeries = new Chart(document.getElementById('timeSeriesChart'), {
                type: 'line',
                data: {
                    labels: timeData.map(t => t.month),
                    datasets: [
                        {
                            label: 'AI Content %',
                            data: timeData.map(t => ((t.ai_count / t.total) * 100).toFixed(2)),
                            borderColor: '#ef4444',
                            backgroundColor: 'rgba(239, 68, 68, 0.05)',
                            tension: 0.4,
                            fill: true,
                            borderWidth: 2,
                            pointRadius: 3
                        },
                        {
                            label: 'Mixed Content %',
                            data: timeData.map(t => ((t.mixed_count / t.total) * 100).toFixed(2)),
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.05)',
                            tension: 0.4,
                            fill: true,
                            borderWidth: 2,
                            pointRadius: 3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'top', labels: { font: { size: 12 } } } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: 'Percentage (%)', font: { size: 12 } },
                            grid: { color: 'rgba(0,0,0,0.04)' }
                        },
                        x: {
                            title: { display: true, text: 'Month', font: { size: 12 } },
                            grid: { display: false }
                        }
                    }
                }
            });
            
            const topicData = data.topic_distribution;
            const colors = [
                '#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981',
                '#06b6d4', '#6366f1', '#a855f7', '#d946ef', '#f43f5e',
                '#84cc16', '#22c55e', '#14b8a6', '#0ea5e9', '#6366f1'
            ];
            
            charts.topic = new Chart(document.getElementById('topicChart'), {
                type: 'pie',
                data: {
                    labels: topicData.map(t => t.primary_topic),
                    datasets: [{
                        data: topicData.map(t => t.count),
                        backgroundColor: colors,
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    onClick: (event, elements) => {
                        if (elements.length > 0) {
                            const topic = topicData[elements[0].index].primary_topic;
                            window.open(`search.html?dataset_type=${currentDataset}&topic=${encodeURIComponent(topic)}`, '_blank');
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { font: { size: 11 }, padding: 8, boxWidth: 12 }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = ((context.parsed / total) * 100).toFixed(1);
                                    return `${context.label}: ${context.parsed.toLocaleString()} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
            
            const newspaperContainer = document.getElementById('newspaper-chart-container');
            
            if (currentDataset === 'opinions') {
                newspaperContainer.classList.remove('hidden');
                
                const newspaperData = data.newspaper_distribution || [];
                
                const processedNewspaperData = await Promise.all(
                    newspaperData.map(async (newspaper) => {
                        try {
                            const articles = await window.dataLoader.getArticles({
                                newspaper: newspaper.newspaper,
                                dataset_type: currentDataset,
                                limit: 1000
                            });
                            const predictionCounts = { Human: 0, Mixed: 0, AI: 0 };
                            articles.articles.forEach(article => {
                                const prediction = article.prediction;
                                if (predictionCounts.hasOwnProperty(prediction)) {
                                    predictionCounts[prediction]++;
                                }
                            });
                            return {
                                newspaper: newspaper.newspaper,
                                total: newspaper.count,
                                human: predictionCounts.Human,
                                mixed: predictionCounts.Mixed,
                                ai: predictionCounts.AI
                            };
                        } catch (error) {
                            console.warn(`Error processing newspaper ${newspaper.newspaper}:`, error);
                            const total = newspaper.count;
                            return {
                                newspaper: newspaper.newspaper,
                                total: total,
                                human: Math.floor(total * 0.6),
                                mixed: Math.floor(total * 0.2),
                                ai: Math.floor(total * 0.2)
                            };
                        }
                    })
                );
                
                charts.newspaper = new Chart(document.getElementById('newspaperChart'), {
                    type: 'bar',
                    data: {
                        labels: processedNewspaperData.map(n => n.newspaper),
                        datasets: [
                            { label: 'AI', data: processedNewspaperData.map(n => n.ai), backgroundColor: '#ef4444', borderColor: '#dc2626', borderWidth: 1 },
                            { label: 'Mixed', data: processedNewspaperData.map(n => n.mixed), backgroundColor: '#f59e0b', borderColor: '#d97706', borderWidth: 1 },
                            { label: 'Human', data: processedNewspaperData.map(n => n.human), backgroundColor: '#10b981', borderColor: '#059669', borderWidth: 1 }
                        ]
                    },
                    options: {
                        responsive: true,
                        onClick: (event, elements) => {
                            if (elements.length > 0) {
                                const element = elements[0];
                                const newspaper = processedNewspaperData[element.index].newspaper;
                                let prediction = '';
                                if (element.datasetIndex === 0) prediction = 'AI';
                                else if (element.datasetIndex === 1) prediction = 'Mixed';
                                else if (element.datasetIndex === 2) prediction = 'Human';
                                window.open(`search.html?dataset_type=${currentDataset}&newspaper=${encodeURIComponent(newspaper)}&prediction=${encodeURIComponent(prediction)}`, '_blank');
                            }
                        },
                        plugins: {
                            legend: { display: true, position: 'top', labels: { font: { size: 12 }, padding: 12 } },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const value = context.parsed.y;
                                        const total = processedNewspaperData[context.dataIndex].total;
                                        const percentage = ((value / total) * 100).toFixed(1);
                                        return `${context.dataset.label}: ${value.toLocaleString()} (${percentage}%)`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: { stacked: true, title: { display: true, text: 'Newspaper', font: { size: 12 } }, grid: { display: false } },
                            y: { stacked: true, beginAtZero: true, title: { display: true, text: 'Number of Articles', font: { size: 12 } }, grid: { color: 'rgba(0,0,0,0.04)' } }
                        }
                    }
                });
            } else {
                newspaperContainer.classList.add('hidden');
                if (charts.newspaper) {
                    charts.newspaper.destroy();
                    charts.newspaper = null;
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const datasetType = urlParams.get('type') || 'recent_news';
            loadDataset(datasetType);
        });
    </script>
</body>
</html>
